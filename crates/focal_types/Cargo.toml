[package]
name = "focal-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "focal_types"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]
schema = ["serde", "dep:schemars"]

[dependencies]
schemars = { version = "1.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
